<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1190" viewBox="0 0 1680 1190" role="img" aria-labelledby="title desc">
  <title id="title">Mail.ai email scheduling workflow</title>
  <desc id="desc">A user describes an email, the backend prepares and validates a proposal, confirmation creates schedule and job records, QStash triggers a signed callback at the due time, and the worker sends through Gmail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8ff"/><stop offset="1" stop-color="#eef2fb"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6758e8"/><stop offset="1" stop-color="#5549cc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#26314f" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#858ba1"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6758e8"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#319a76"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d49532"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202538}
      .title{font-size:36px;font-weight:760;letter-spacing:-.8px}.sub{font-size:16px;fill:#737b91}
      .phase{font-size:13px;font-weight:800;letter-spacing:2px;fill:#777e93}
      .ct{font-size:17px;font-weight:740}.body{font-size:13px;fill:#687187}.small{font-size:12px;fill:#747c91}
      .white{fill:#fff}.purpletext{fill:#5b4fda}.green{fill:#278566}.amber{fill:#996a20}
    </style>
  </defs>
  <rect width="1680" height="1190" fill="url(#bg)"/>
  <text x="64" y="70" class="title">Mail.ai · Email scheduling workflow</text>
  <text x="64" y="102" class="sub">Two deliberate stages: prepare a proposal first, then schedule only after confirmation.</text>

  <rect x="64" y="136" width="1552" height="40" rx="20" fill="#e9e6ff"/>
  <text x="86" y="162" class="phase purpletext">01 · UNDERSTAND THE REQUEST AND PREPARE A PROPOSAL</text>

  <g filter="url(#shadow)">
    <rect x="64" y="205" width="250" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="94" cy="237" r="17" fill="#6758e8"/><text x="94" y="243" text-anchor="middle" class="white" font-size="14" font-weight="800">1</text>
    <text x="121" y="243" class="ct">User describes email</text>
    <text x="86" y="279" class="body">Recipient · message · time</text>
    <text x="86" y="304" class="body">Browser sends text + timezone</text>
    <text x="86" y="330" class="small">Authenticated session required</text>

    <rect x="360" y="205" width="270" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="390" cy="237" r="17" fill="#6758e8"/><text x="390" y="243" text-anchor="middle" class="white" font-size="14" font-weight="800">2</text>
    <text x="417" y="243" class="ct">Chat service loads context</text>
    <text x="382" y="279" class="body">Checks owner and conversation</text>
    <text x="382" y="304" class="body">Saves user turn in MongoDB</text>
    <text x="382" y="330" class="small">Uses recent history + proposal state</text>

    <rect x="676" y="205" width="270" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="706" cy="237" r="17" fill="#6758e8"/><text x="706" y="243" text-anchor="middle" class="white" font-size="14" font-weight="800">3</text>
    <text x="733" y="243" class="ct">Bedrock assists</text>
    <text x="698" y="279" class="body">Writes the reply and classifies</text>
    <text x="698" y="304" class="body">CHAT / CLARIFICATION / PROPOSAL</text>
    <text x="698" y="330" class="small">No tools; cannot call scheduler/Gmail</text>

    <rect x="992" y="205" width="270" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="1022" cy="237" r="17" fill="#319a76"/><text x="1022" y="243" text-anchor="middle" class="white" font-size="14" font-weight="800">4</text>
    <text x="1049" y="243" class="ct">Backend validates fields</text>
    <text x="1014" y="279" class="body">Recipients · dates · timezone</text>
    <text x="1014" y="304" class="body">Recurrence interval and limits</text>
    <text x="1014" y="330" class="small">Rejects incomplete or invalid proposal</text>

    <rect x="1308" y="205" width="308" height="145" rx="19" fill="#fff" stroke="#d9eee5"/>
    <circle cx="1338" cy="237" r="17" fill="#319a76"/><text x="1338" y="243" text-anchor="middle" class="white" font-size="14" font-weight="800">5</text>
    <text x="1365" y="243" class="ct">Ready proposal</text>
    <text x="1330" y="279" class="body">READY record saved in PostgreSQL</text>
    <text x="1330" y="304" class="body">Expires after 15 minutes</text>
    <text x="1330" y="330" class="small">UI renders review card via SSE</text>
  </g>

  <path d="M314 278H352" stroke="#858ba1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M630 278H668" stroke="#858ba1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M946 278H984" stroke="#858ba1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1262 278H1300" stroke="#319a76" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <path d="M806 350V390H1115" fill="none" stroke="#9a8eef" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowPurple)"/>
  <rect x="1115" y="365" width="497" height="54" rx="16" fill="#f1efff" stroke="#ded9ff"/>
  <text x="1135" y="389" class="body purpletext" font-weight="700">If details are missing or ambiguous</text>
  <text x="1135" y="408" class="small">Ask a clarification; do not create a schedule. User replies and the chat turn repeats.</text>

  <rect x="64" y="445" width="1552" height="40" rx="20" fill="#e8f4ef"/>
  <text x="86" y="471" class="phase green">02 · USER CONFIRMS AND THE BACKEND CREATES SCHEDULES</text>

  <g filter="url(#shadow)">
    <rect x="1308" y="515" width="308" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="1338" cy="547" r="17" fill="#319a76"/><text x="1338" y="553" text-anchor="middle" class="white" font-size="14" font-weight="800">6</text>
    <text x="1365" y="553" class="ct">User confirms</text>
    <text x="1330" y="589" class="body">Proposal button or supported</text>
    <text x="1330" y="614" class="body">verbal confirmation in chat</text>
    <text x="1330" y="640" class="small">No confirmation means no schedule</text>

    <rect x="992" y="515" width="270" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="1022" cy="547" r="17" fill="#319a76"/><text x="1022" y="553" text-anchor="middle" class="white" font-size="14" font-weight="800">7</text>
    <text x="1049" y="553" class="ct">Confirmation checked</text>
    <text x="1014" y="589" class="body">Owner · proposal ID · READY</text>
    <text x="1014" y="614" class="body">Expiry · lock against duplicates</text>
    <text x="1014" y="640" class="small">Database state is authoritative</text>

    <rect x="676" y="515" width="270" height="145" rx="19" fill="#fff" stroke="#d9eee5"/>
    <circle cx="706" cy="547" r="17" fill="#319a76"/><text x="706" y="553" text-anchor="middle" class="white" font-size="14" font-weight="800">8</text>
    <text x="733" y="553" class="ct">One DB transaction</text>
    <text x="698" y="589" class="body">Create schedule(s) + due jobs</text>
    <text x="698" y="614" class="body">Mark proposal CONFIRMED</text>
    <text x="698" y="640" class="small">PostgreSQL commit</text>

    <rect x="360" y="515" width="270" height="145" rx="19" fill="#fff" stroke="#f0dfbf"/>
    <circle cx="390" cy="547" r="17" fill="#d49532"/><text x="390" y="553" text-anchor="middle" class="white" font-size="14" font-weight="800">9</text>
    <text x="417" y="553" class="ct">After commit: publish</text>
    <text x="382" y="589" class="body">Register each due job with</text>
    <text x="382" y="614" class="body">QStash using its scheduled time</text>
    <text x="382" y="640" class="small">Current code publishes directly</text>

    <rect x="64" y="515" width="250" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="94" cy="547" r="17" fill="#d49532"/><text x="94" y="553" text-anchor="middle" class="white" font-size="14" font-weight="800">10</text>
    <text x="121" y="553" class="ct">QStash waits</text>
    <text x="86" y="589" class="body">Holds delayed callback</text>
    <text x="86" y="614" class="body">until job is due</text>
    <text x="86" y="640" class="small">Retries callback delivery</text>
  </g>

  <path d="M1308 587H1270" stroke="#858ba1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M992 587H954" stroke="#858ba1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M676 587H638" stroke="#319a76" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M360 587H322" stroke="#d49532" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <rect x="360" y="681" width="590" height="53" rx="16" fill="#fff5e6" stroke="#f2d7a7"/>
  <text x="380" y="704" class="body amber" font-weight="750">Reliability gap in current implementation</text>
  <text x="380" y="723" class="small">If QStash publish fails after commit, DB state remains; no outbox/re-publisher currently recovers it.</text>

  <rect x="64" y="765" width="1552" height="40" rx="20" fill="#fff2e8"/>
  <text x="86" y="791" class="phase amber">03 · QSTASH CALLBACK TRIGGERS DELIVERY THROUGH GMAIL</text>

  <g filter="url(#shadow)">
    <rect x="64" y="835" width="250" height="145" rx="19" fill="#fff" stroke="#f0dfbf"/>
    <circle cx="94" cy="867" r="17" fill="#d49532"/><text x="94" y="873" text-anchor="middle" class="white" font-size="14" font-weight="800">11</text>
    <text x="121" y="873" class="ct">Due time arrives</text>
    <text x="86" y="909" class="body">QStash calls internal</text>
    <text x="86" y="934" class="body">send endpoint</text>
    <text x="86" y="960" class="small">Signed HTTP callback</text>

    <rect x="360" y="835" width="270" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="390" cy="867" r="17" fill="#6758e8"/><text x="390" y="873" text-anchor="middle" class="white" font-size="14" font-weight="800">12</text>
    <text x="417" y="873" class="ct">Verify and claim</text>
    <text x="382" y="909" class="body">Check signature and job due</text>
    <text x="382" y="934" class="body">Atomic PENDING → SENDING</text>
    <text x="382" y="960" class="small">Duplicate callbacks are skipped</text>

    <rect x="676" y="835" width="270" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="706" cy="867" r="17" fill="#e25466"/><text x="706" y="873" text-anchor="middle" class="white" font-size="14" font-weight="800">13</text>
    <text x="733" y="873" class="ct">Send using Gmail</text>
    <text x="698" y="909" class="body">Refresh stored user token</text>
    <text x="698" y="934" class="body">Call Gmail send API</text>
    <text x="698" y="960" class="small">Email is sent from user's account</text>

    <rect x="992" y="835" width="270" height="145" rx="19" fill="#fff" stroke="#d9eee5"/>
    <circle cx="1022" cy="867" r="17" fill="#319a76"/><text x="1022" y="873" text-anchor="middle" class="white" font-size="14" font-weight="800">14</text>
    <text x="1049" y="873" class="ct">Persist outcome</text>
    <text x="1014" y="909" class="body">SENT + Gmail message ID</text>
    <text x="1014" y="934" class="body">or FAILED + error details</text>
    <text x="1014" y="960" class="small">PostgreSQL job state</text>

    <rect x="1308" y="835" width="308" height="145" rx="19" fill="#fff" stroke="#e2e6f0"/>
    <circle cx="1338" cy="867" r="17" fill="#6758e8"/><text x="1338" y="873" text-anchor="middle" class="white" font-size="14" font-weight="800">15</text>
    <text x="1365" y="873" class="ct">UI refreshes schedules</text>
    <text x="1330" y="909" class="body">User sees schedule status</text>
    <text x="1330" y="934" class="body">from backend API</text>
    <text x="1330" y="960" class="small">Frontend never sends the email</text>
  </g>
  <path d="M314 907H352" stroke="#d49532" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <path d="M630 907H668" stroke="#858ba1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M946 907H984" stroke="#e25466" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1262 907H1300" stroke="#319a76" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <text x="64" y="1040" class="small">Key invariant: a proposal is not a schedule until a valid user confirmation succeeds.</text>
  <text x="64" y="1065" class="small">Key limitation: database commit, QStash publish, and Gmail delivery are separate failure boundaries—not one atomic transaction.</text>
</svg>
